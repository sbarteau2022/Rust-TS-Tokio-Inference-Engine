[workspace]
members = ["."]
resolver = "2"

[package]
name = "rust-server"
version = "0.1.0"
edition = "2021"

[features]
default = ["native-mlx"]
native-mlx = ["dep:tokenizers"]
legacy-python = ["tokio/process", "tokio/io-util"]
debug-validation = []

[dependencies]
anyhow = "1"
flatbuffers = "25.12.19"
metal = "0.33"
block = "0.1.6"
objc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "signal"] }
sha2 = "0.10.9"
bytes = "=1.12.1"
hyper = { version = "=1.12.0", default-features = false, features = ["http1", "server"] }
hyper-util = { version = "=0.1.21", default-features = false, features = ["tokio"] }
http-body-util = "=0.1.5"
tokio-stream = { version = "=0.1.19", default-features = false }

tokenizers = { version = "0.23.2", default-features = false, features = ["fancy-regex"], optional = true }

[build-dependencies]
cc = "1"

[[example]]
name = "native_discriminators"
required-features = ["native-mlx"]

[[example]]
name = "native_suite_reference"
required-features = ["native-mlx"]

[[example]]
name = "native_device_reference"
required-features = ["native-mlx"]

[[example]]
name = "native_device_pressure"
required-features = ["native-mlx"]

[[example]]
name = "native_speculative_smoke"
required-features = ["native-mlx"]

[[example]]
name = "native_automaton_smoke"
required-features = ["native-mlx"]

[[example]]
name = "native_hidden_smoke"
required-features = ["native-mlx"]

[[example]]
name = "native_mtp_smoke"
required-features = ["native-mlx"]

[[example]]
name = "native_mtp_decode_smoke"
required-features = ["native-mlx"]

[[example]]
name = "native_mtp_bench"
required-features = ["native-mlx"]

[[example]]
name = "native_mtp_automaton_smoke"
required-features = ["native-mlx"]

[[example]]
name = "native_mtp_scheduler_smoke"
required-features = ["native-mlx"]

[[example]]
name = "native_mtp_scheduler_bench"
required-features = ["native-mlx"]

[[example]]
name = "native_text_stream_smoke"
required-features = ["native-mlx"]

[dev-dependencies]
hyper = { version = "=1.12.0", default-features = false, features = ["client", "http1"] }
