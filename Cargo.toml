[workspace]
members = ["."]
resolver = "2"

[package]
name = "rust-server"
version = "0.1.0"
edition = "2021"

[features]
default = []
debug-validation = []

[dependencies]
anyhow = "1"
flatbuffers = "25.12.19"
metal = "0.33"
block = "0.1.6"
objc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util"] }
sha2 = "0.10.9"

[build-dependencies]
cc = "1"
